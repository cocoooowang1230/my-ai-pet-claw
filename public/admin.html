<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2e7d6"><title>PetClaw 管理後台</title><style>
:root{--paper:#fbf6ec;--shell:#f2e7d6;--ink:#211a12;--muted:#827563;--accent:#ee9a28;--line:#d6c6ac;--white:#fffaf1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#aaa79630 .8px,transparent .8px) 0 0/12px 12px,var(--paper);color:var(--ink);font:14px/1.5 system-ui,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink)}button.primary{background:var(--ink);color:var(--white)}input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}label{display:grid;gap:5px;font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0}.top{padding:18px max(16px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fbf6ecee;position:sticky;top:0;z-index:5;backdrop-filter:blur(9px)}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.wrap{max-width:1180px;margin:24px auto;padding:0 16px 60px}.note{padding:13px 15px;border:1px solid #d7bc80;background:#f6ebca;border-radius:11px;font-size:12px;margin:15px 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:2px 3px 0 #dcd9cf}.card h2{font-size:16px;margin-bottom:13px}.wide{grid-column:1/-1}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.currencies{display:grid;grid-template-columns:1fr 1fr;gap:14px}.subcard{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fbf6ec}.subcard h3{font-size:14px;margin-bottom:10px}.check{display:flex;align-items:center;gap:8px;font-size:12px}.check input{width:auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:610px;font-size:12px}td,th{padding:8px 9px;border-bottom:1px solid #e4d9c7;text-align:left;vertical-align:top}th{background:#f2e7d6}.status{color:#8b6a32;font-size:12px;margin-top:10px;min-height:18px}.top-actions{display:flex;gap:8px;align-items:center}.hidden{display:none!important}.login{max-width:420px;margin:10vh auto;background:var(--white);padding:24px;border:1px solid var(--line);border-radius:16px}.login label{margin:12px 0}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#eee0bd;font-size:10px}@media(max-width:760px){.grid,.currencies{grid-template-columns:1fr}.wide{grid-column:auto}.top{padding:12px 14px}.wrap{margin:14px auto}.fields{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><div class="brand">MY AI PET · PetClaw<small>營運管理後台</small></div><div class="top-actions"><a href="/" aria-label="回到遊戲"><button>回到遊戲</button></a><button id="logout" class="hidden">登出</button></div></header><main class="wrap"><div id="login" class="login"><h1>管理員登入</h1><p class="status">管理帳戶由部署環境中的管理員設定建立。</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>密碼<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="primary">登入後台</button><p id="loginMsg" class="status"></p></div><div id="app" class="hidden"><div class="note"><b>營運測試設定</b>：點數、機率、保夾門檻和獎品庫存由本頁管理。Credits 僅能由管理員核發；目前尚未串接金流。配送會建立待處理訂單，尚未串物流商。</div><div class="grid">
<section class="card wide"><h2>遊戲與點數規則</h2><div class="currencies"><div class="subcard"><h3>RP 獎池</h3><div class="fields"><label>每次消耗<input id="rpCost" type="number" min="1"></label><label>保夾門檻<input id="rpThreshold" type="number" min="0"></label><label>一般爪中獎率 %<input id="rpWeak" type="number" min="0" max="100" step="0.1"></label><label>強爪中獎率 %<input id="rpStrong" type="number" min="0" max="100" step="0.1"></label></div></div><div class="subcard"><h3>Credits 高階獎池</h3><div class="fields"><label>每次消耗<input id="creditCost" type="number" min="1"></label><label>保夾門檻<input id="creditThreshold" type="number" min="0"></label><label>一般爪中獎率 %<input id="creditWeak" type="number" min="0" max="100" step="0.1"></label><label>強爪中獎率 %<input id="creditStrong" type="number" min="0" max="100" step="0.1"></label></div></div></div><div class="fields" style="margin-top:12px"><label>Pass 核發 Credits<input id="passCredits" type="number" min="0"></label><label>金券 SP 獎勵<input id="ticketSP" type="number" min="0"></label><label class="check"><input id="shippingEnabled" type="checkbox">開放玩家申請寄送</label><label class="check"><input id="registrationEnabled" type="checkbox">開放玩家註冊</label></div><p class="status" id="configMsg"></p><button id="saveConfig" class="primary">儲存遊戲設定</button></section>
<section class="card"><h2>核發點數</h2><div class="fields"><label>玩家帳戶<select id="grantUser"></select></label><label>幣別<select id="grantCurrency"><option>Credits</option><option>RP</option><option>SP</option></select></label><label>數量<input id="grantAmount" type="number" min="1" value="150"></label></div><p class="status" id="grantMsg"></p><button id="grantBtn" class="primary">核發並記錄</button></section>
<section class="card"><h2>新增／更新獎品</h2><input id="prizeId" type="hidden"><div class="fields"><label>獎品名稱<input id="prizeName" maxlength="120"></label><label>類型<select id="prizeKind"><option value="physical">實體商品</option><option value="plush">MY AI PET 玩偶</option><option value="capsule">驚喜球</option><option value="ticket">金色獎券</option><option value="digital">數位獎品</option></select></label><label>庫存<input id="prizeStock" type="number" min="0" value="0"></label><label>抽中權重<input id="prizeWeight" type="number" min="1" value="1"></label><label>RP 商店兌換價<input id="prizePrice" type="number" min="0" value="0"></label><label>回收可得 RP<input id="prizeRecycle" type="number" min="0" value="0"></label><label>獲得 SP<input id="prizeSP" type="number" min="0" value="0"></label><label class="check"><input id="poolRP" type="checkbox" checked>加入 RP 獎池</label><label class="check"><input id="poolCredits" type="checkbox" checked>加入 Credits 獎池</label><label class="check"><input id="prizeActive" type="checkbox" checked>上架</label></div><p class="status" id="prizeMsg"></p><button id="savePrize" class="primary">儲存獎品</button> <button id="clearPrize">清空欄位</button></section>
<section class="card wide"><h2>獎品與庫存</h2><div id="prizes" class="table-wrap"></div></section>
<section class="card wide"><h2>配送訂單</h2><div id="orders" class="table-wrap"></div></section>
<section class="card wide"><h2>最近遊玩紀錄</h2><div id="plays" class="table-wrap"></div></section>
</div></div></main><script src="/demo-api.js"></script><script>
const $=s=>document.querySelector(s);let data=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(path,options={}){const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'操作失敗');return d;}function tbl(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}">目前沒有資料</td></tr>`}</tbody></table>`;}function prizeForm(p){$('#prizeId').value=p.id;$('#prizeName').value=p.name;$('#prizeKind').value=p.kind;$('#prizeStock').value=p.stock;$('#prizeWeight').value=p.weight;$('#prizePrice').value=p.price_rp;$('#prizeRecycle').value=p.recycle_rp;$('#prizeSP').value=p.sp_reward;$('#poolRP').checked=p.pool_rp;$('#poolCredits').checked=p.pool_credits;$('#prizeActive').checked=p.active;window.scrollTo({top:document.querySelector('#prizeName').getBoundingClientRect().top+scrollY-100,behavior:'smooth'});}function clearPrize(){prizeForm({id:'',name:'',kind:'physical',stock:0,weight:1,price_rp:0,recycle_rp:0,sp_reward:0,pool_rp:true,pool_credits:true,active:true});$('#prizeId').value='';}
async function load(){try{data=await call('admin');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');const c=data.config;$('#rpCost').value=c.currency.RP.cost;$('#rpThreshold').value=c.currency.RP.threshold;$('#rpWeak').value=c.currency.RP.weakChance*100;$('#rpStrong').value=c.currency.RP.strongChance*100;$('#creditCost').value=c.currency.Credits.cost;$('#creditThreshold').value=c.currency.Credits.threshold;$('#creditWeak').value=c.currency.Credits.weakChance*100;$('#creditStrong').value=c.currency.Credits.strongChance*100;$('#passCredits').value=c.passCredits;$('#ticketSP').value=c.goldTicketSP;$('#shippingEnabled').checked=c.shippingEnabled!==false;$('#registrationEnabled').checked=c.registrationEnabled!==false;
$('#grantUser').innerHTML=data.users.map(u=>`<option value="${esc(u.id)}">${esc(u.email)} · RP ${u.rp} / C ${u.credits}</option>`).join('');$('#prizes').innerHTML=tbl(['獎品','類型','庫存','權重','RP 商店價','回收 RP','獎池','狀態','操作'],data.prizes.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.kind)}</td><td>${p.stock}</td><td>${p.weight}</td><td>${p.price_rp}</td><td>${p.recycle_rp}</td><td>${[p.pool_rp?'RP':'',p.pool_credits?'Credits':''].filter(Boolean).join('、')}</td><td>${p.active?'上架':'下架'}</td><td><button data-edit="${esc(p.id)}">編輯</button></td></tr>`));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>prizeForm(data.prizes.find(p=>p.id===b.dataset.edit)));
$('#orders').innerHTML=tbl(['建立時間','玩家','收件人','電話','地址','狀態','更新'],data.orders.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString()}</td><td>${esc(o.email)}</td><td>${esc(o.recipient)}</td><td>${esc(o.phone)}</td><td>${esc(o.address)}</td><td>${esc(o.status)}</td><td><select data-order="${esc(o.id)}"><option ${o.status==='requested'?'selected':''} value="requested">待處理</option><option ${o.status==='approved'?'selected':''} value="approved">已確認</option><option ${o.status==='shipped'?'selected':''} value="shipped">已寄出</option><option ${o.status==='delivered'?'selected':''} value="delivered">已送達</option><option ${o.status==='cancelled'?'selected':''} value="cancelled">取消</option></select><button data-order-save="${esc(o.id)}">更新</button></td></tr>`));document.querySelectorAll('[data-order-save]').forEach(b=>b.onclick=async()=>{try{await call('admin',{method:'POST',body:JSON.stringify({action:'orderStatus',orderId:b.dataset.order,status:document.querySelector(`[data-order="${CSS.escape(b.dataset.order)}"]`).value})});await load();}catch(e){alert(e.message);}});
$('#plays').innerHTML=tbl(['時間','玩家','幣別','消耗','強爪','結果','獎品'],data.plays.map(p=>`<tr><td>${new Date(p.created_at).toLocaleString()}</td><td>${esc(p.email)}</td><td>${esc(p.currency)}</td><td>${p.cost}</td><td>${p.strong?'是':'否'}</td><td>${p.success?'中獎':'未中'}</td><td>${esc(p.prize_name||'—')}</td></tr>`));}catch(e){$('#loginMsg').textContent=e.message;}}
$('#loginBtn').onclick=async()=>{try{await call('auth',{method:'POST',body:JSON.stringify({action:'login',email:$('#email').value,password:$('#password').value})});await load();}catch(e){$('#loginMsg').textContent=e.message;}};$('#logout').onclick=async()=>{await call('auth',{method:'POST',body:JSON.stringify({action:'logout'})});location.reload();};$('#saveConfig').onclick=async()=>{const chance=id=>Number($(id).value)/100;const c={currency:{RP:{cost:Number($('#rpCost').value),threshold:Number($('#rpThreshold').value),weakChance:chance('#rpWeak'),strongChance:chance('#rpStrong')},Credits:{cost:Number($('#creditCost').value),threshold:Number($('#creditThreshold').value),weakChance:chance('#creditWeak'),strongChance:chance('#creditStrong')}},passCredits:Number($('#passCredits').value),goldTicketSP:Number($('#ticketSP').value),shippingEnabled:$('#shippingEnabled').checked,registrationEnabled:$('#registrationEnabled').checked};try{await call('admin',{method:'POST',body:JSON.stringify({action:'config',config:c})});$('#configMsg').textContent='設定已儲存。';await load();}catch(e){$('#configMsg').textContent=e.message;}};
$('#grantBtn').onclick=async()=>{try{await call('admin',{method:'POST',body:JSON.stringify({action:'grant',userId:$('#grantUser').value,currency:$('#grantCurrency').value,amount:Number($('#grantAmount').value)})});$('#grantMsg').textContent='已核發，並寫入帳務紀錄。';await load();}catch(e){$('#grantMsg').textContent=e.message;}};$('#savePrize').onclick=async()=>{const prize={id:$('#prizeId').value||undefined,name:$('#prizeName').value,kind:$('#prizeKind').value,stock:Number($('#prizeStock').value),weight:Number($('#prizeWeight').value),priceRP:Number($('#prizePrice').value),recycleRP:Number($('#prizeRecycle').value),spReward:Number($('#prizeSP').value),poolRP:$('#poolRP').checked,poolCredits:$('#poolCredits').checked,active:$('#prizeActive').checked};try{await call('admin',{method:'POST',body:JSON.stringify({action:'prize',prize})});$('#prizeMsg').textContent='獎品已儲存。';clearPrize();await load();}catch(e){$('#prizeMsg').textContent=e.message;}};$('#clearPrize').onclick=clearPrize;load();
</script></body></html>
